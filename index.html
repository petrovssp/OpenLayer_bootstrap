<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenLayers Bulgaria Portal</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- OpenLayers CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/ol.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Bulgaria GIS Portal</span>
    </div>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- LEFT PANEL -->
        <div class="col-3 sidebar p-3">

            <div class="accordion" id="layersAccordion">

                <!-- BASE LAYERS -->
                <div class="accordion-item">
                    <h2 class="accordion-header" id="baseLayersHeader">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse"
                                data-bs-target="#baseLayers" aria-expanded="true">
                            <i class="bi bi-layers me-2"></i>Base Layers
                        </button>
                    </h2>
                    <div id="baseLayers" class="accordion-collapse collapse show"
                         data-bs-parent="#layersAccordion">
                        <div class="accordion-body">

                            <div class="form-check">
                                <input class="form-check-input base-layer" type="radio" name="baseLayer"
                                       id="osmLayer" value="osm" checked>
                                <label class="form-check-label" for="osmLayer">OpenStreetMap</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input base-layer" type="radio" name="baseLayer"
                                       id="googleLayer" value="google">
                                <label class="form-check-label" for="googleLayer">Google Satellite</label>
                            </div>

                        </div>
                    </div>
                </div>

                <!-- GEOSERVER WMS LAYERS -->
                <div class="accordion-item">
                    <h2 class="accordion-header" id="wmsLayersHeader">
                        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse"
                                data-bs-target="#wmsLayers">
                            <i class="bi bi-map me-2"></i>GeoServer Layers
                        </button>
                    </h2>
                    <div id="wmsLayers" class="accordion-collapse collapse"
                         data-bs-parent="#layersAccordion">
                        <div class="accordion-body">

                            <div class="form-check">
                                <input class="form-check-input wms-layer" type="checkbox" id="obl" value="Oblasti" checked>
                                <label class="form-check-label" for="obl">Области</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input wms-layer" type="checkbox" id="mun" value="Munisipalities" checked>
                                <label class="form-check-label" for="mun">Общини</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input wms-layer" type="checkbox" id="sett" value="Settlement" checked>
                                <label class="form-check-label" for="sett">Населени места</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input wms-layer" type="checkbox" id="reki" value="Reki" checked>
                                <label class="form-check-label" for="reki">Реки</label>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
 
                <!-- Legend Section (button + panel together) -->
                <div id="legendContainer" class="mt-3">

                    <!-- Toggle Button -->
                    <button id="legendToggle" class="btn btn-sm btn-primary w-100">Legend ▼</button>

                    <!-- Legend Panel (collapsible) -->
                    <div id="legendPanel" class="legend-panel collapsed">
                        <div id="legendBody" class="legend-body">
                            <div id="legendContent"></div>

                            <!-- Scroll Slider -->
                            <input type="range" id="legendScroll" min="0" max="100" value="0" class="legend-scroll">
                        </div>
                    </div>

                </div>

        </div>

        <!-- MAP PANEL -->
        <div class="col-9 p-0">
            <div id="map"></div>



        <!-- Feature Info Popup -->
        <div id="popup" class="ol-popup">
            <a href="#" id="popup-closer" class="ol-popup-closer"></a>
            <div id="popup-content"></div>
        </div>
</div>

    </div>
</div>

<!-- MAP PANEL -->



<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- OpenLayers JS -->
<script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>

<!-- Custom JS -->
<script src="main.js"></script>

</body>
</html>
